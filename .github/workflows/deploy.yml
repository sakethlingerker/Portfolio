name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Node.js (Active LTS: Node 26)"
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript types
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Report Playwright and runner diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Installed Playwright version: $(npx --no-install playwright --version)"
          echo "Ubuntu runner version:"
          if [[ -r /etc/os-release ]]; then
            grep -E '^(PRETTY_NAME|VERSION_ID|VERSION_CODENAME)=' /etc/os-release
          else
            uname -a
          fi

      - name: Install Playwright browsers
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail

          max_attempts=3
          retry_delays=(0 20 40)
          log_file="$(mktemp /tmp/playwright-install.XXXXXX.log)"
          apt_conf_file="/etc/apt/apt.conf.d/99-playwright-ci-timeouts"

          cleanup() {
            rm -f "$log_file"
            if [[ -e "$apt_conf_file" ]]; then
              sudo rm -f "$apt_conf_file"
            fi
          }
          trap cleanup EXIT

          # Configure short-lived APT network timeouts so stalled mirrors fail fast.
          sudo tee "$apt_conf_file" >/dev/null <<'EOF'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "1";
          EOF

          transient_error_regex='Temporary failure resolving|Could not resolve host|Name or service not known|Failed to fetch|Unable to fetch|Connection timed out|Connect Timeout|Temporary failure in name resolution|Some index files failed to download|Connection reset by peer|socket hang up|TLS handshake timeout|EAI_AGAIN|ENOTFOUND|ETIMEDOUT|ECONNRESET|ECONNREFUSED|ENETUNREACH|EHOSTUNREACH|fetch failed'

          for (( attempt = 1; attempt <= max_attempts; attempt++ )); do
            delay="${retry_delays[$((attempt - 1))]}"
            if (( delay > 0 )); then
              echo "Waiting ${delay}s before Chromium installation attempt ${attempt}/${max_attempts}..."
              sleep "$delay"
            fi

            echo "=== Playwright Chromium installation attempt ${attempt}/${max_attempts} ==="
            : > "$log_file"

            set +e
            timeout --kill-after=15s 180s npx playwright install --with-deps chromium 2>&1 | tee "$log_file"
            pipe_status=("${PIPESTATUS[@]}")
            set -e

            install_exit_code="${pipe_status[0]}"
            tee_exit_code="${pipe_status[1]}"

            if (( install_exit_code == 0 && tee_exit_code == 0 )); then
              echo "Playwright Chromium installation succeeded on attempt ${attempt}/${max_attempts}."
              exit 0
            fi

            if (( install_exit_code == 0 && tee_exit_code != 0 )); then
              echo "::error::Logging pipe (tee) failed with exit code ${tee_exit_code} during Chromium installation."
              exit "$tee_exit_code"
            fi

            if (( install_exit_code == 124 || install_exit_code == 137 )); then
              echo "::warning::Attempt ${attempt}/${max_attempts} timed out after 180s (exit code: ${install_exit_code})."
              if (( attempt == max_attempts )); then
                echo "::error::Chromium installation timed out across all ${max_attempts} attempts (last exit code: ${install_exit_code})."
                exit "$install_exit_code"
              fi
            elif grep -qiE "$transient_error_regex" "$log_file"; then
              echo "::warning::Attempt ${attempt}/${max_attempts} failed with exit code ${install_exit_code} due to a transient DNS/network error."
              if (( attempt == max_attempts )); then
                echo "::error::Chromium installation failed after ${max_attempts} attempts due to repeated DNS/network errors (last exit code: ${install_exit_code})."
                exit "$install_exit_code"
              fi
            else
              echo "::error::Attempt ${attempt}/${max_attempts} failed with a non-transient error (exit code: ${install_exit_code}). Not retrying."
              exit "$install_exit_code"
            fi
          done

      - name: Verify Playwright Chromium installation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'EOF'
          import { accessSync, constants } from 'node:fs';
          import { chromium } from 'playwright';

          const execPath = chromium.executablePath();
          accessSync(execPath, constants.X_OK);
          console.log('Verified Chromium executable:', execPath);

          const browser = await chromium.launch({ headless: true });
          console.log('Verified Chromium browser version:', browser.version());
          await browser.close();
          EOF

      - name: Generate baseline fixtures from commit ee53012
        run: node scripts/generate-baseline.mjs

      - name: Build production portfolio
        run: npm run build
        env:
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}

      - name: Start built preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/Portfolio/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1

      - name: Run Workbench chat regression tests
        run: npm run test:browser

      - name: Run GSAP animation test suite
        run: npm run test:animations

      - name: Run comprehensive website regression tests
        run: |
          npm run test:regression 2>&1 | tee /tmp/regression-test.log || {
            STATUS=$?
            echo "## Comprehensive Regression Test Output" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat /tmp/regression-test.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $STATUS
          }

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4