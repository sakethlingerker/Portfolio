name: "Engineering Workbench Chat & Portfolio Regression"

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Set up Node.js (Active LTS: Node 26)"
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build portfolio
        run: npm run build

      - name: Start built portfolio preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/Portfolio/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1

      - name: Run Workbench chat browser regression tests
        run: npm run test:browser

      - name: Run comprehensive website regression tests
        run: npm run test:regression
